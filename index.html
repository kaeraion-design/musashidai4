<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      text-align: center;
      background-color: #f0f8ff;
      margin: 0;
      padding: 10px;
      user-select: none;
    }
    #game-container {
      max-width: 500px;
      height: 600px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 15px;
      background-color: #4CAF50;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #status-bar {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      background: #e8f5e9;
      font-size: 1rem;
      font-weight: bold;
    }
    #question-box {
      font-size: 1.3rem;
      font-weight: bold;
      padding: 15px 20px;
      color: #333;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      flex-grow: 1;
      position: relative;
      background: #fafafa;
      border-top: 2px dashed #ddd;
    }
    .choice-btn {
      position: absolute;
      width: 140px;
      height: 60px;
      background-color: #ff9800;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px #e65100;
      cursor: pointer;
      transition: transform 0.1s;
      word-break: break-all;
      padding: 5px;
    }
    .choice-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    #left-btn { left: 10%; }
    #right-btn { right: 10%; }

    .screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 20px;
    }
    .start-btn {
      padding: 15px 40px;
      font-size: 1.5rem;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px #0d47a1;
    }
    .result-score {
      font-size: 3rem;
      color: #e91e63;
      font-weight: bold;
      margin: 15px 0;
    }
    .result-time {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>漢字を正しく使おう！（4年生）</header>

  <!-- スタート画面 -->
  <div id="start-screen" class="screen">
    <h2>かんじクイズ（ぜん20もん）</h2>
    <p>上から落ちてくるただしい漢字をえらぼう！<br>制限時間は1問あたり７秒！</p>
    <button class="start-btn" onclick="startGame()">スタート！</button>
  </div>

  <!-- プレイ画面 -->
  <div id="play-screen" style="display: none; height: 100%; flex-direction: column;">
    <div id="status-bar">
      <span id="q-count">だい 1 / 20 問</span>
      <span id="timer">のこり: 7.0秒</span>
    </div>
    <div id="question-box"></div>
    <div id="stage">
      <button id="left-btn" class="choice-btn" onclick="selectAnswer(this.innerText)"></button>
      <button id="right-btn" class="choice-btn" onclick="selectAnswer(this.innerText)"></button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="screen" style="display: none;">
    <h2>けっか発表！</h2>
    <div class="result-score" id="final-score">0 点</div>
    <div class="result-time" id="final-time">かかった時間: 0秒</div>
    <button class="start-btn" onclick="resetGame()">もういちど遊ぶ</button>
  </div>
</div>

<script>
  // 問題データを直接内蔵
  const questions = [
    { id: 1, text: "倉庫の戸があく。", choices: ["空く", "開く"], answer: "開く" },
    { id: 2, text: "向かいがわの席があく。", choices: ["空く", "開く"], answer: "空く" },
    { id: 3, text: "工場のきかい化に成功する。", choices: ["機械", "機会"], answer: "機械" },
    { id: 4, text: "きかいがあれば参加したい。", choices: ["機械", "機会"], answer: "機会" },
    { id: 5, text: "受付に名札をかえす。", choices: ["返す", "変えす"], answer: "返す" },
    { id: 6, text: "むすことまごをさきにかえす。", choices: ["返す", "帰す"], answer: "帰す" },
    { id: 7, text: "英語いがいの言語も学ぶ。", choices: ["以外", "意外"], answer: "以外" },
    { id: 8, text: "牧場は、いがいに遠かった。", choices: ["以外", "意外"], answer: "意外" },
    { id: 9, text: "つくえから、ペンがおちた。", choices: ["落ちた", "落た"], answer: "落ちた" },
    { id: 10, text: "つくえから、ペンをおとした。", choices: ["落した", "落とした"], answer: "落とした" },
    { id: 11, text: "「古い読（ ）本」の読み方は？", choices: ["とく", "どく"], answer: "どく" },
    { id: 12, text: "音読（  ）してみたの読み方は？", choices: ["おんとく", "おんどく"], answer: "おんどく" },
    { id: 13, text: "明後日の読み方は？", choices: ["みょうみょうにち", "みょうごにち"], answer: "みょうごにち" },
    { id: 14, text: "説明（  ）会の読み方は？", choices: ["せつめい", "せつみょう"], answer: "せつめい" },
    { id: 15, text: "運動場で体をうごかす。", choices: ["動かす", "働かす"], answer: "動かす" },
    { id: 16, text: "頭をはたらかせて考える。", choices: ["動かせて", "働かせて"], answer: "働かせて" },
    { id: 17, text: "友だちと意見があう。", choices: ["合う", "会う"], answer: "合う" },
    { id: 18, text: "駅の前で友だちにあう。", choices: ["合う", "会う"], answer: "会う" },
    { id: 19, text: "ノートに文字をかく。", choices: ["書く", "角"], answer: "書く" },
    { id: 20, text: "学校のまわり。", choices: ["周り", "回り"], answer: "周り" }
  ];

  let currentQIndex = 0;
  let score = 0;
  let totalStartTime, questionStartTime;
  let animationFrameId;
  let posY = 0;
  const FALL_DURATION = 7000; // 7秒

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('play-screen').style.display = 'flex';
    score = 0;
    currentQIndex = 0;
    totalStartTime = Date.now();
    showQuestion();
  }

  function resetGame() {
    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
    }
    startGame();
  }

  function showQuestion() {
    if (currentQIndex >= questions.length) {
      endGame();
      return;
    }

    const q = questions[currentQIndex];
    document.getElementById('q-count').innerText = `だい ${currentQIndex + 1} / ${questions.length} 問`;
    document.getElementById('question-box').innerText = q.text;

    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    const isShuffle = Math.random() < 0.5;
    leftBtn.innerText = isShuffle ? q.choices[0] : q.choices[1];
    rightBtn.innerText = isShuffle ? q.choices[1] : q.choices[0];

    posY = 0;
    leftBtn.style.top = '0px';
    rightBtn.style.top = '0px';
    questionStartTime = Date.now();

    startFalling();
  }

  function startFalling() {
    const stageHeight = document.getElementById('stage').clientHeight - 70;

    function animate() {
      const elapsed = Date.now() - questionStartTime;
      const progress = elapsed / FALL_DURATION;

      if (progress >= 1) {
        selectAnswer(null);
        return;
      }

      posY = progress * stageHeight;
      document.getElementById('left-btn').style.top = posY + 'px';
      document.getElementById('right-btn').style.top = posY + 'px';

      const remainingSec = Math.max(0, (FALL_DURATION - elapsed) / 1000).toFixed(1);
      document.getElementById('timer').innerText = `のこり: ${remainingSec}秒`;

      animationFrameId = requestAnimationFrame(animate);
    }

    cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame(animate);
  }

  function selectAnswer(selectedChoice) {
    cancelAnimationFrame(animationFrameId);

    const q = questions[currentQIndex];
    const pointsPerQuestion = 100 / questions.length;

    if (selectedChoice === q.answer) {
      score += pointsPerQuestion;
    }

    currentQIndex++;
    showQuestion();
  }

  function endGame() {
    document.getElementById('play-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'flex';

    const totalTime = ((Date.now() - totalStartTime) / 1000).toFixed(1);
    document.getElementById('final-score').innerText = `${Math.round(score)} 点`;
    document.getElementById('final-time').innerText = `かかった時間: ${totalTime} 秒`;
  }
</script>
</body>
</html>
